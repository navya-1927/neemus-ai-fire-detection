<body class="bg-slate-900">
<div id="root" class="text-slate-400 p-8 font-sans">Loading NEEMUS dashboard…</div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ------------------------------- tiny icon set -------------------------------
   Inline SVGs so we don't need the lucide-react package in the browser. */
const Svg = ({ children, className = "w-5 h-5", fill = "none" }) => (
  <svg viewBox="0 0 24 24" className={className} fill={fill} stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const IFlame = (p) => <Svg {...p} fill="currentColor"><path stroke="none"
  d="M12 2c1.5 4.5-3.5 6-3.5 10a4.5 4.5 0 0 0 9 0c0-1.5-.8-2.8-1.5-3.5.3 2-1 3-1 3 .8-4-1.5-7-3-9.5z"/>
  <path stroke="none" d="M12 22a7 7 0 0 1-7-7c0-3 2-5.5 3.5-7C8 12 10 13 10 15.5A2.5 2.5 0 0 0 15 15c0-1-.5-2-.5-2 2 1.2 4.5 3 4.5 6a7 7 0 0 1-7 3z" opacity=".4"/></Svg>;
const IVideo = (p) => <Svg {...p}><path d="m16 10 6-4v12l-6-4z"/><rect x="2" y="6" width="14" height="12" rx="2"/></Svg>;
const IActivity = (p) => <Svg {...p}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></Svg>;
const IClock = (p) => <Svg {...p}><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></Svg>;
const ISearch = (p) => <Svg {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Svg>;
const IDownload = (p) => <Svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></Svg>;
const IRefresh = (p) => <Svg {...p}><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></Svg>;
const IVolume = (p) => <Svg {...p}><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></Svg>;
const IWarn = (p) => <Svg {...p}><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></Svg>;
const IBellOff = (p) => <Svg {...p}><path d="M8.7 3A6 6 0 0 1 18 8c0 4.5 1.2 6.2 2 7"/><path d="M17 17H4c1.5-1.5 2-4 2-9a6 6 0 0 1 .3-2"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/><path d="m2 2 20 20"/></Svg>;
const ICloud = (p) => <Svg {...p}><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9z"/></Svg>;
const ISort = (p) => <Svg {...p}><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></Svg>;
const IX = (p) => <Svg {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Svg>;
const IZap = (p) => <Svg {...p}><path d="M13 2 3 14h7l-1 8 11-13h-7l0-7z"/></Svg>;

/* ------------------------------ live data hooks ------------------------------
   These poll YOUR existing Flask endpoints. This is the whole integration. */

function usePoll(url, intervalMs) {
  const [data, setData] = useState(null);
  useEffect(() => {
    let alive = true;
    const load = () =>
      fetch(url).then((r) => r.json()).then((d) => alive && setData(d))
        .catch(() => alive && setData(null));
    load();
    const id = setInterval(load, intervalMs);
    return () => { alive = false; clearInterval(id); };
  }, [url, intervalMs]);
  return data;
}

const useTelemetry = () => usePoll("/api/telemetry", 2000);
const useEvents = () => usePoll("/api/events", 3000);
const useDiscards = () => {
  const d = usePoll("/api/discards", 5000);
  return Array.isArray(d) ? d : [];
};
const useStats = () => usePoll("/api/stats", 5000);

/* helpers to survive whatever shape a row has */
const evClass = (r) => (r.class_name || r.label || "unknown");
const evTag = (r) => {
  const c = evClass(r);
  return c === "fire" ? "bg-cyan-500 text-slate-900"
       : c === "smoke" ? "bg-slate-600 text-slate-200"
       : "bg-green-600 text-white";
};
const fmtConf = (r) =>
  r.confidence == null ? "N/A" : `${Math.round(r.confidence * 100)}%`;
const fmtTime = (ts) => {
  if (ts == null) return "—";
  const d = typeof ts === "number" ? new Date(ts * 1000) : new Date(ts);
  return isNaN(d) ? String(ts) : d.toLocaleTimeString();
};

/* ---------------------------------- shared ---------------------------------- */

const Card = ({ children, className = "" }) => (
  <div className={`bg-slate-800 border border-slate-700 rounded-lg p-5 ${className}`}>{children}</div>
);
const CardTitle = ({ children, right }) => (
  <div className="flex items-center justify-between mb-4">
    <h2 className="text-sm font-bold tracking-widest text-white uppercase">{children}</h2>
    {right && <span className="text-xs text-slate-500">{right}</span>}

);
const StatusDot = ({ color = "bg-cyan-400" }) => (
  <span className={`inline-block w-2 h-2 rounded-full ${color} mr-2 flex-shrink-0`} />
);
const MicroLabel = ({ children, className = "" }) => (
  <p className={`text-xs uppercase tracking-wider text-slate-500 ${className}`}>{children}</p>
);
const DemoBadge = () => (
  <span className="text-xs text-amber-500/80 border border-amber-700/50 rounded px-1.5 py-0.5 ml-2">demo data</span>
);

/* The live video: one <img> pointed at your MJPEG route. That's it. */
const LiveVideo = ({ className = "" }) => {
  const [dead, setDead] = useState(false);
  return (
    <div className={`relative w-full aspect-video bg-black/40 rounded-md overflow-hidden border border-slate-700 ${className}`}>
      {!dead ? (
        <img src="/video_feed" alt="Live camera feed"
             className="absolute inset-0 w-full h-full object-contain"
             onError={() => setDead(true)} />
      ) : (
        <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-500 gap-2">
          <IVideo className="w-8 h-8" />
          <p className="text-sm">No video — is the detector running?</p>
        </div>
      )}
    </div>
  );
};

/* --------------------------------- screen 1 --------------------------------- */

          </div>

        </div>
      </Card>

      <Card>
        <CardTitle>System Status</CardTitle>
        <div className="space-y-4">
          <div>
            <MicroLabel className="normal-case tracking-normal mb-1">Detector:</MicroLabel>
            <p className="flex items-center text-white text-sm">
              <StatusDot color={online ? "bg-green-400" : "bg-red-500"} />

          <div>
            <MicroLabel className="normal-case tracking-normal mb-1">Camera Connection:</MicroLabel>
            <p className="flex items-center text-white text-sm"><StatusDot />IMX219 CSI / dev webcam</p>
          </div>
          <div>
            <MicroLabel className="normal-case tracking-normal mb-1">Model:</MicroLabel>
            <p className="flex items-center text-white text-sm"><StatusDot />YOLOv8-Nano (best.pt)</p>
          </div>
          <div>
            <MicroLabel className="normal-case tracking-normal mb-1">FPS:</MicroLabel>
            <p className="flex items-center text-white text-sm font-mono">
              <StatusDot />{telemetry && telemetry.fps != null ? telemetry.fps : "—"}
            </p>
          </div>
        </div>

        <hr className="border-slate-700 my-5" />
        <h3 className="text-white font-bold mb-4">Detection Configuration</h3>
        <div className="flex items-center justify-between mb-1">
          <p className="text-sm text-slate-300">Confidence Threshold <DemoBadge /></p>
          <p className="text-white font-mono text-sm">{threshold.toFixed(2)}</p>
        </div>
        <input type="range" min="0" max="1" step="0.01" value={threshold}

                   onChange={() => setRadio(opt)} className="accent-cyan-500" />
            <span className={radio === opt ? "text-white font-semibold" : "text-slate-400"}>{opt}</span>
          </label>
        ))}
      </Card>

      <Card>
        <CardTitle>Detection Log</CardTitle>
        <MicroLabel className="normal-case tracking-normal mb-1">Active Sensor:</MicroLabel>
        <p className="text-white text-sm mb-4">Normal Light – IMX219</p>
        <hr className="border-slate-700 my-4" />
        <h3 className="text-xs font-bold tracking-widest text-white uppercase mb-3">
          Detection Log Stats <span className="text-slate-500 font-normal normal-case">(live)</span>
        </h3>

            <tr className="text-left text-xs text-slate-500 border-b border-slate-700">
              <th className="pb-2 font-medium">Event</th>
              <th className="pb-2 font-medium">Time</th>

            </tr>
          </thead>
          <tbody>
            {events.slice(0, 6).map((r, i) => (
              <tr key={i} className={`border-b border-slate-700/50 ${i === 0 ? "bg-slate-700/40" : ""}`}>
                <td className="py-2.5">
                  <span className={`px-2 py-0.5 rounded text-xs font-semibold ${evTag(r)}`}>{evClass(r)}</span>
                </td>
                <td className="py-2.5 text-slate-300">{fmtTime(r.timestamp)}</td>
                <td className="py-2.5 text-white text-right font-mono">{fmtConf(r)}</td>
              </tr>
            ))}
            {events.length === 0 && (
              <tr><td colSpan="3" className="py-6 text-center text-slate-500">
                No detections logged yet — point a fire video at the camera 🔥</td></tr>

        </table>
      </Card>
    </div>
  );
}

/* --------------------------------- screen 3 --------------------------------- */

const discardRows = [
  { ts: "12:01:05 AM", fid: "FID-022", conf: "0.35", cls: "Unknown", reason: "Confidence < 0.6" },
  { ts: "12:01:12 AM", fid: "FID-031", conf: "0.52", cls: "Smoke", reason: "Confidence < 0.6" },
  { ts: "12:01:25 AM", fid: "FID-045", conf: "N/A", cls: "Invalid ID", reason: "Invalid Class ID Output" },
];

const ConfidenceGauge = ({ pct }) => {
  const r = 52, c = 2 * Math.PI * r, filled = (pct / 100) * c;
  return (
    <div className="relative w-36 h-36">
      <svg viewBox="0 0 128 128" className="w-full h-full -rotate-90">
        <circle cx="64" cy="64" r={r} fill="none" stroke="#334155" strokeWidth="10" />
        <circle cx="64" cy="64" r={r} fill="none" stroke="#22d3ee" strokeWidth="10"
                strokeLinecap="round" strokeDasharray={`${filled} ${c - filled}`} />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <p className="text-3xl font-extrabold text-white">{pct}%</p>
        <p className="text-xs text-slate-400">or {(pct / 100).toFixed(2)}</p>
      </div>
    </div>
  );
};

function ScreenTimeline() {
  const discards = useDiscards();
  const events = useEvents() || [];
  const alerts = events.filter((e) => e.alert_triggered);
  const selected = alerts[0] || events[0] || null;

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div className="space-y-5">
        <Card>
          <CardTitle>Historical Timeline <span className="text-slate-500 font-normal normal-case">(live)</span></CardTitle>
          <div className="relative pl-8">
            <div className="absolute left-2 top-1 bottom-1 w-px bg-slate-600" />
            <div className="space-y-4">
              {events.slice(0, 6).map((e, i) => (
                <div key={i} className="relative flex items-center gap-4">
                  <span className={`absolute -left-8 ml-0.5 w-3 h-3 rounded-full border-2 border-slate-800 ${
                    e.alert_triggered ? "bg-cyan-400" : "bg-slate-500"}`} />
                  <span className="text-xs text-slate-400 w-20 flex-shrink-0 font-mono">{fmtTime(e.timestamp)}</span>
                  <div className={`flex items-center gap-2 flex-1 px-4 py-2.5 rounded text-sm font-semibold uppercase ${
                    e.alert_triggered ? "bg-cyan-700/80 text-white" : "bg-slate-700 text-slate-300"}`}>
                    {e.alert_triggered ? <IFlame className="w-4 h-4" /> : <IX className="w-4 h-4" />}
                    {e.alert_triggered ? `${evClass(e)} ALARM` : `${evClass(e)} detection`}
                  </div>
                </div>
              ))}
              {events.length === 0 && <p className="text-slate-500 text-sm py-4">No events yet.</p>}
            </div>
          </div>
        </Card>

        <Card>
          <CardTitle>Discard Log &amp; Anomalies <DemoBadge /></CardTitle>
          <div className="overflow-x-auto">
            <table className="w-full text-sm min-w-max">
              <thead>
                <tr className="text-left text-xs text-slate-500 border-b border-slate-700">
                  {["Timestamp", "Frame ID", "Confidence", "Classification", "Reason for Discard"].map((h) => (
                    <th key={h} className="pb-2 pr-4 font-medium">{h}</th>))}
                </tr>
              </thead>
              <tbody>
                {discards.map((r, i) => (
                  <tr key={i} className="border-b border-slate-700/50">
                    <td className="py-3 pr-4 text-slate-300 font-mono text-xs">{fmtTime(r.timestamp)}</td>
                    <td className="py-3 pr-4 text-slate-300 font-mono text-xs">#{r.id}</td>
                    <td className="py-3 pr-4 text-white font-mono">{r.confidence != null ? Number(r.confidence).toFixed(2) : "N/A"}</td>
                    <td className="py-3 pr-4 text-slate-300">{r.class_name || "Unknown"}</td>
                    <td className="py-3 text-slate-400">{r.reason}</td>
                  </tr>))}
              </tbody>
            </table>
          </div>
          <p className="text-xs text-slate-600 mt-3">Real discard logging = a future AlertManager upgrade (log rejected frames to a discards table).</p>
        </Card>
      </div>

      <Card className="self-start">
        <CardTitle right="Latest alarm">Event Inspector</CardTitle>
        {selected ? (
          <div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <LiveVideo className="aspect-video" />
              <div className="flex flex-col items-center">
                <ConfidenceGauge pct={selected.confidence != null ? Math.round(selected.confidence * 100) : 0} />
                <MicroLabel className="mt-2">Confidence gauge</MicroLabel>
                <div className="flex gap-2 mt-4">
                  <span className={`text-xs font-bold px-3 py-1 rounded-full ${evClass(selected) === "fire" ? "bg-cyan-500 text-slate-900" : "bg-slate-600 text-slate-300"}`}>Fire</span>
                  <span className={`text-xs font-bold px-3 py-1 rounded-full ${evClass(selected) === "smoke" ? "bg-cyan-500 text-slate-900" : "bg-slate-600 text-slate-300"}`}>Smoke</span>
                </div>
              </div>
            </div>
            <hr className="border-slate-700 my-5" />
            <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3 text-sm">
              <p className="text-slate-400">Detection ID: <span className="text-white font-mono">#{selected.id ?? "—"}</span></p>
              <p className="text-slate-400">Class: <span className="text-white font-mono">{evClass(selected)}</span></p>
              <p className="text-slate-400">Bounding box: <span className="text-white font-mono text-xs">{selected.bbox ? String(selected.bbox).slice(0, 40) : "—"}</span></p>
              <p className="text-slate-400">Decision: <span className="text-white font-semibold">{selected.alert_triggered ? "Alarm Activated" : "Logged (below alarm rules)"}</span></p>
            </div>
          </div>
        ) : <p className="text-slate-500 text-sm py-6">No events to inspect yet.</p>}
      </Card>
    </div>
  );
}

/* --------------------------------- screen 4 --------------------------------- */

  const events = useEvents() || [];
  const lastAlert = events.find((e) => e.alert_triggered);
  const recentAlarm = lastAlert && (Date.now() / 1000 - (typeof lastAlert.timestamp === "number"
    ? lastAlert.timestamp : Date.parse(lastAlert.timestamp) / 1000)) < 30;
  const [relayOn, setRelayOn] = useState(true);
  const [volume, setVolume] = useState(15);
  const [muted, setMuted] = useState(false);

  return (
    <div>
      <h1 className="text-2xl font-extrabold text-white tracking-wide mb-1 uppercase">
        Screen 4: Active Alarm &amp; Control Center</h1>
      <p className="text-xs text-slate-500 tracking-widest uppercase mb-6">
        Emergency response interface – physical hardware state (Jetson Nano)</p>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card>
          <div className="flex items-start gap-3 mb-6">
            <IVolume className="w-8 h-8 text-slate-300" />
            <div>
              <h2 className="text-sm font-bold tracking-widest text-white uppercase">Audible Alarm:</h2>
              <MicroLabel>PWM piezo buzzer</MicroLabel>
            </div>
          </div>
          <p className={`text-5xl font-extrabold tracking-tight ${recentAlarm && !muted ? "text-red-500 animate-pulse" : "text-white"}`}>
            {recentAlarm && !muted ? "ACTIVE" : "STANDBY"}</p>
          <p className="text-xs text-slate-500 mt-2">Driven by AlertManager (last alarm &lt; 30s = ACTIVE)</p>
          <hr className="border-slate-700 my-6" />
          <div className="flex items-center gap-3">
            <IVolume className="w-5 h-5 text-slate-400" />
            <input type="range" min="0" max="100" value={volume}
                   onChange={(e) => setVolume(parseInt(e.target.value, 10))}
                   className="w-40 accent-cyan-500 cursor-pointer" />
            <span className="text-xs text-slate-500 font-mono w-8">{volume}%</span>
          </div>
          <MicroLabel className="mt-4">External fire suppression <DemoBadge /></MicroLabel>
        </Card>

        <Card>
          <div className="flex items-start gap-3 mb-6">
            <IZap className="w-8 h-8 text-slate-300" />
            <div>
              <h2 className="text-sm font-bold tracking-widest text-white uppercase">Visual Alarm:</h2>
              <MicroLabel>RGB LED strip</MicroLabel>
            </div>
          </div>
          <p className={`text-5xl font-extrabold tracking-tight flex items-center gap-3 ${recentAlarm ? "text-cyan-400" : "text-slate-500"}`}>
            {recentAlarm ? "ACTIVE" : "IDLE"} <IActivity className="w-7 h-7" /></p>
          <div className="flex gap-1 mt-4">
            {Array.from({ length: 20 }).map((_, i) => (
              <span key={i}
                className={`w-3 h-7 rounded-sm ${recentAlarm ? "animate-pulse " : "opacity-30 "}${i % 2 === 0 ? "bg-cyan-400" : "bg-red-500"}`}
                style={{ animationDelay: `${(i % 4) * 150}ms` }} />))}
          </div>
          <div className="bg-black/40 border border-slate-700 rounded-md p-4 mt-5">
            <h3 className="text-xs font-bold tracking-widest text-white uppercase mb-3">5V Relay Control <DemoBadge /></h3>
            <div className="flex items-center justify-between gap-2">
              <button onClick={() => setRelayOn(!relayOn)}
                className={`relative w-14 h-7 rounded-full transition-colors flex-shrink-0 ${relayOn ? "bg-cyan-500" : "bg-slate-600"}`}>
                <span className={`absolute top-0.5 w-6 h-6 bg-white rounded-full shadow transition-all ${relayOn ? "left-7" : "left-0.5"}`} />
              </button>
              <p className="text-white font-extrabold text-sm text-right leading-tight uppercase">
                {relayOn ? "Suppression System Engaged" : "Suppression Standby"}</p>
            </div>
            <div className="mt-4 border border-amber-700 bg-amber-950/40 rounded px-3 py-2 flex items-start gap-2">
              <IWarn className="w-4 h-4 text-amber-500 flex-shrink-0 mt-0.5" />
              <p className="text-xs text-amber-400">Relay/buzzer control needs Dev's hardware module (mode: gpio) — until then this panel is visual only.</p>
            </div>
          </div>
        </Card>

        <Card>
          <div className="flex items-start gap-3 mb-2">
            <ICloud className="w-8 h-8 text-yellow-500" />
            <div>
              <h2 className="text-sm font-bold tracking-widest text-yellow-500 uppercase">Local Storage</h2>
              <MicroLabel>Events stored locally in SQLite3</MicroLabel>
            </div>
          </div>
          <button onClick={() => setMuted(!muted)}
            className={`mt-4 w-full rounded-lg flex flex-col items-center justify-center gap-4 py-14 font-extrabold text-xl tracking-wide transition-colors ${
              muted ? "bg-slate-700 text-slate-400" : "bg-cyan-600 hover:bg-cyan-500 text-white"}`}>
            <IBellOff className="w-14 h-14" />
            {muted ? "ALARMS MUTED (UI)" : <span className="text-center leading-snug">ACKNOWLEDGE<br />&amp; MUTE ALARMS</span>}
          </button>
          <p className="text-xs text-slate-600 mt-3">Wiring this to really silence the buzzer = a future /api/alarm/acknowledge endpoint.</p>
        </Card>
      </div>
    </div>
  );
}

/* --------------------------------- screen 5 --------------------------------- */

function ScreenEventDatabase() {
  const events = useEvents() || [];
  const [sortAsc, setSortAsc] = useState(false);
  const [typeFilter, setTypeFilter] = useState("All");

  let rows = events.filter((r) =>
    typeFilter === "All" ? true :
    typeFilter === "Threat (alarm)" ? r.alert_triggered :
    evClass(r) === typeFilter.toLowerCase());
  rows = [...rows].sort((a, b) => {
    const ta = a.timestamp, tb = b.timestamp;
    return sortAsc ? (ta > tb ? 1 : -1) : (ta < tb ? 1 : -1);
  });

  const exportCsv = () => {
    const header = "id,timestamp,class,confidence,alert_triggered\n";
    const body = rows.map((r) =>
      [r.id, r.timestamp, evClass(r), r.confidence, r.alert_triggered].join(",")).join("\n");
    const blob = new Blob([header + body], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "event_log.csv";
    a.click();
  };

  return (
    <div>
      <h1 className="text-2xl font-extrabold text-white tracking-wide mb-1 uppercase">
        Screen 5: Global Event Database (Logs)</h1>
      <p className="text-xs text-slate-500 tracking-widest uppercase mb-6">
        Historical data review and log export — live from data/detections.db</p>
      <Card>
        <div className="flex flex-wrap items-end gap-3 mb-4">
          <div>
            <h3 className="text-white font-bold text-sm mb-2">Filter by Event Type</h3>
            <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)}
              className="bg-cyan-600 border border-cyan-500 text-white font-semibold rounded-md px-3 py-2.5 text-sm">
              {["All", "Threat (alarm)", "Fire", "Smoke"].map((o) => <option key={o}>{o}</option>)}
            </select>
          </div>
          <button onClick={exportCsv}
            className="flex items-center gap-2 bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-semibold px-5 py-2.5 rounded-md transition-colors">
            <IDownload className="w-4 h-4" /> Export Logs (CSV)
          </button>
          <span className="text-xs text-slate-500 ml-auto">{rows.length} events shown</span>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm min-w-max">
            <thead>
              <tr className="text-left text-slate-400 border-b border-slate-700">
                <th className="py-3 pr-6 font-semibold">
                  <button className="flex items-center gap-1 hover:text-white" onClick={() => setSortAsc(!sortAsc)}>
                    Timestamp <ISort className="w-3.5 h-3.5" /></button></th>
                <th className="py-3 pr-6 font-semibold">Type</th>
                <th className="py-3 pr-6 font-semibold">Confidence</th>
                <th className="py-3 pr-6 font-semibold">Actuation State</th>
                <th className="py-3 font-semibold">Storage</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-700/50 hover:bg-slate-700/30 transition-colors">
                  <td className="py-3.5 pr-6 text-slate-200 font-mono text-xs">{fmtTime(r.timestamp)}</td>
                  <td className="py-3.5 pr-6">
                    <span className={`px-2 py-0.5 rounded text-xs font-semibold ${
                      r.alert_triggered ? "bg-red-800 text-red-200" : evTag(r)}`}>
                      {r.alert_triggered ? "Threat" : evClass(r)}</span></td>
                  <td className="py-3.5 pr-6 text-white font-mono">{r.confidence != null ? Number(r.confidence).toFixed(2) : "N/A"}</td>
                  <td className="py-3.5 pr-6 text-slate-300">{r.alert_triggered ? "Engaged" : "Standby"}</td>
                  <td className="py-3.5 text-slate-300">Local (SQLite)</td>
                </tr>))}
              {rows.length === 0 && (
                <tr><td colSpan="5" className="py-8 text-center text-slate-500">No events match — run the detector to fill this table.</td></tr>)}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

/* ----------------------------------- shell ----------------------------------- */

const TABS = [
  { id: 1, label: "Screen 1: Live Feed", C: ScreenLiveFeed },
  { id: 2, label: "Screen 2: Telemetry", C: ScreenTelemetry },
  { id: 3, label: "Screen 3: Timeline", C: ScreenTimeline },
  { id: 4, label: "Screen 4: Alarm Control", C: ScreenAlarmControl },
  { id: 5, label: "Screen 5: Event Database", C: ScreenEventDatabase },
];

function NeemusDashboard() {
  const [active, setActive] = useState(1);
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  const telemetry = useTelemetry();
  const online = telemetry && telemetry.status === "ONLINE";
  const Active = TABS.find((t) => t.id === active).C;

  return (
    <div className="min-h-screen bg-slate-900 text-slate-300 font-sans">
      <header className="border-b border-slate-800">
        <div className="flex items-center justify-between px-6 py-4 flex-wrap gap-3">
          <div className="flex items-center gap-6">
            <div className="flex items-center gap-2">
              <span className="flex items-center justify-center w-9 h-9 rounded-full border-2 border-white/80">
                <IFlame className="w-5 h-5 text-white" /></span>
              <span className="text-2xl font-extrabold text-white tracking-tight">NEEMUS</span>
            </div>
            <span className="hidden md:block text-slate-200 font-medium">
              NEEMUS AI <span className="text-cyan-400">Fire</span> Detection Suite</span>
          </div>
          <div className="flex items-center gap-5">
            <span className="flex items-center gap-2 text-white font-semibold text-lg font-mono">
              <IClock className="w-4 h-4 text-slate-500" />
              {now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span>
            <span className="flex items-center gap-2 text-white text-sm font-semibold whitespace-nowrap">
              <span className={`w-2.5 h-2.5 rounded-full ${online ? "bg-green-500 animate-pulse" : "bg-red-500"}`} />
              {online ? "OPERATIONAL" : "DETECTOR OFFLINE"}</span>
          </div>
        </div>
        <nav className="flex gap-2 px-6 pb-3 overflow-x-auto">
          {TABS.map((t) => (
            <button key={t.id} onClick={() => setActive(t.id)}
              className={`px-4 py-2 rounded-md text-sm font-semibold whitespace-nowrap transition-colors ${
                active === t.id ? "bg-cyan-400 text-slate-900"
                : "bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white"}`}>
              {t.label}</button>))}
        </nav>
      </header>
      <main className="p-6 max-w-screen-2xl mx-auto"><Active /></main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NeemusDashboard />);
</script>
</body>
</html>
