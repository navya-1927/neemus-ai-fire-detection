# Neemus Fire Detection — system config
# Owned by: Saarang Agarwal (System Software, Monitoring & Data Management)
# Do not hardcode these values in scripts — read from here.
model:
  weights_path: "models/best.pt"   # dev-machine testing; switch to .engine on Jetson
  input_size: 416
detection:
  confidence_threshold: 0.6      # matches proposal: "Confidence threshold: 0.6 (tunable)"
  classes:
    - smoke
    - fire
  # Debounce: require N consecutive detecting frames before raising an alert,
  # to avoid a single noisy frame triggering a false alarm.
  debounce_frames: 3
  # How long (seconds) to suppress repeat alerts after one fires, so the
  # buzzer/relay doesn't re-trigger every frame while fire is still in view.
  alert_cooldown_seconds: 30

logging:
  db_path: "data/detections.db"
  log_level: "INFO"

dashboard:
  host: "0.0.0.0"
  port: 5000
  refresh_seconds: 5
  live_frame_path: "data/live_frame.jpg"   # on Jetson: /dev/shm/neemus_frame.jpg

camera:
  source: 0
  frame_width: 416
  frame_height: 416
  target_fps: 15

alarm:
  buzzer_gpio_pin: 18
  led_gpio_pin: 23
  relay_gpio_pin: 24